[package]
name = "rbx-linux"
version = "0.1.0"
edition = "2021"
description = "High-performance Wine/Proton launcher and wrapper for Windows Roblox binaries on Linux"
authors = ["rbx-linux"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
dirs = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
ureq = { version = "2.10", features = ["json"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
